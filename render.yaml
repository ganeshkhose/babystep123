services:
  # 1. Backend Express API (Free Web Service)
  - type: web
    name: baby-step-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_ORIGIN
        value: '*'

  # 2. Frontend React + Vite SPA (Free Static Site)
  - type: static
    name: baby-step-client
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
